services:
  - type: web
    name: sanskrit-pos-api
    env: python
    buildCommand: pip install -r requirements.txt || pip install -r backend/requirements.txt
    startCommand: sh -c "if [ -d 'backend' ]; then cd backend; fi && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
