name: Daily Sanskrit POS Dataset Google Drive Backup

on:
  schedule:
    # 18:35 UTC = 12:05 AM IST (Midnight + 5 minutes every night)
    - cron: '35 18 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

jobs:
  backup-to-drive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt || pip install -r requirements.txt

      - name: Sync Verified Dataset to Google Drive
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GDRIVE_WEBHOOK_URL: ${{ secrets.GDRIVE_WEBHOOK_URL }}
        run: |
          python backend/scripts/sync_to_drive.py
